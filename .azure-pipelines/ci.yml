# ============================================================================
# CI (Azure Pipelines)
# ----------------------------------------------------------------------------
# Purpose : Private-host scan, session function-length ratchet, lint, typecheck,
#           DAG core gate, unit/HttpAPI/generated-code tests on Linux
#           (Windows DAG tests run in GitHub Actions)
# Trigger : Push to `main`, PRs targeting `main`, manual run
# Jobs    : Typecheck               — private-host scan, its unit test,
#                                     session function-length ratchet, lint,
#                                     typecheck, database baseline, DAG core
#                                     gate, oc tests
#           Unit Tests (workspace)  — workspace tests except graphagent, Go,
#                                     and generated-code checks
#           Unit Tests (graphagent N/4) — graphagent tests in parallel shards
#           Unit Tests (HttpAPI)    — HttpAPI exerciser gates
#           Bench (TUI)             — TUI frame-budget and store-write gate
#           Unit Tests (linux)      — aggregate; succeeds only when every
#                                     unit job succeeded
# Gate    : Typecheck and Unit Tests (linux) are the merge
#           gates. Every PR and every main push runs the full suite; there is
#           no result reuse. Fork PRs build only after a member comments.
#           Windows DAG tests are a GitHub Actions check on the self-hosted runner.
# Agents  : Azure DevOps "GitHub-hosted Agents" pool, billed per minute with
#           no reserved parallel jobs: ubuntu-24.04-8-core (8 vCPU, 32 GB).
# Release : GitHub Actions release-fork.yml; .azure-pipelines/release.yml is
#           the fallback.
# ============================================================================

name: $(Date:yyyyMMdd)$(Rev:.r)

trigger:
  batch: false
  branches:
    include:
      - main

pr:
  autoCancel: true
  drafts: true
  branches:
    include:
      - main

parameters:
  - name: shards
    displayName: graphagent unit test shards
    type: object
    default: [1, 2, 3, 4]

variables:
  GOTOOLCHAIN: local

jobs:
  - job: typecheck
    displayName: Typecheck
    pool:
      name: GitHub-hosted Agents
      vmImage: ubuntu-24.04-8-core
    timeoutInMinutes: 45
    steps:
      - checkout: self
        fetchDepth: 1
      - template: templates/toolchain.yml
      - bash: node --test script/toolchain.test.mjs script/ci-azure.test.mjs && bash script/setup-gh.test.sh
        displayName: Test toolchain pins and pipeline definitions
      # Rule 3 reads the optional PRIVATE_HOST_PATTERNS secret; an undefined
      # variable stays literal and the scanner reports rule 3 as skipped.
      - bash: bun run check:hosts
        displayName: Check private hosts
        env:
          PRIVATE_HOST_PATTERNS: $(PRIVATE_HOST_PATTERNS)
      - bash: bun run check:hosts:test
        displayName: Test private host scanner
      # #1019: src/session functions may not grow or appear past the turn/ (150)
      # and session/ (300) line limits; recorded debt only ever shrinks.
      - bash: bun run check:fn-length
        displayName: Check session function length
      - bash: bun run lint
        displayName: Run lint
      - bash: bun typecheck
        displayName: Run typecheck
      - bash: bun run --cwd packages/core migration --check
        displayName: Check database baseline
      - bash: bun run check:license
        displayName: Check license boundaries
      - bash: bun run test:dag-core
        displayName: Run DAG core behavior and coverage gate
        workingDirectory: packages/graphagent
        timeoutInMinutes: 10
      # #498 B1: archive integrity boundary of the `oc` installer — SHA256SUMS
      # must be verified before extraction and fail closed on mismatch.
      - bash: bash script/oc-install-boundary.test.sh && bash script/oc-path-priority.test.sh
        displayName: Run oc install boundary tests
        timeoutInMinutes: 5

  - job: unit_workspace
    displayName: Unit Tests (workspace)
    pool:
      name: GitHub-hosted Agents
      vmImage: ubuntu-24.04-8-core
    timeoutInMinutes: 45
    steps:
      - checkout: self
        fetchDepth: 1
      - template: templates/toolchain.yml
        parameters:
          go: true
          ripgrep: true
          gitIdentity: true
      - task: Cache@2
        displayName: Cache Turbo
        inputs:
          key: 'turbo | "$(Agent.OS)" | turbo.json | package.json | bun.lock | "$(Build.SourceVersion)"'
          restoreKeys: |
            turbo | "$(Agent.OS)" | turbo.json | package.json | bun.lock
            turbo | "$(Agent.OS)"
          path: .turbo/cache
      # graphagent:test runs in the sharded jobs below. Workspace tasks run one
      # at a time to avoid CPU contention timing out 250ms Node workers.
      - bash: bun turbo test --concurrency=1 --filter='!graphagent'
        displayName: Run workspace unit tests
        timeoutInMinutes: 20
        env:
          GRAPHAGENT_DISABLE_FILEWATCHER: "false"
      - bash: go test ./...
        displayName: Run config assistant tests
        workingDirectory: config_assistant
      - bash: bun run check:generated
        displayName: Check generated SDK
        workingDirectory: packages/sdk/js

  - ${{ each shard in parameters.shards }}:
      - job: unit_graphagent_${{ shard }}
        displayName: Unit Tests (graphagent ${{ shard }}/${{ length(parameters.shards) }})
        pool:
          name: GitHub-hosted Agents
          vmImage: ubuntu-24.04-8-core
        timeoutInMinutes: 45
        steps:
          - checkout: self
            fetchDepth: 1
          - template: templates/toolchain.yml
            parameters:
              ripgrep: true
              gitIdentity: true
          # Mirrors graphagent#test's ^build dependency in turbo.json.
          - bash: bun turbo run build --filter='graphagent^...'
            displayName: Build graphagent test dependencies
          - ${{ if eq(shard, 1) }}:
              - bash: >-
                  bun test --timeout 30000 --only-failures test/session/prompt.test.ts
                  --test-name-pattern '^(runs builtin read/grep/glob settlement through stored history into the next (AI SDK|Native) request|automatically compacts (AI SDK|Native) folded history at the token threshold|recovers (AI SDK|Native) overflow through an unprojected summary and a continued turn|terminates (AI SDK|Native) overflow when the full compaction request is also rejected)$'
                displayName: Run context-folding lifecycle preflight
                workingDirectory: packages/graphagent
                timeoutInMinutes: 3
          # --shard splits the suite's files into disjoint subsets; --timings
          # balances them by recorded per-file durations. Refresh
          # test/ci-timings.json with --update-timings when shards drift apart.
          - bash: bun test --timeout 30000 --only-failures --shard=${{ shard }}/${{ length(parameters.shards) }} --timings=test/ci-timings.json
            displayName: Run graphagent unit test shard
            workingDirectory: packages/graphagent
            timeoutInMinutes: 20
            env:
              GRAPHAGENT_DISABLE_FILEWATCHER: "false"

  # #1025 7.7: hard counters fail outright; timing metrics compare against
  # the committed baseline with a machine-calibration factor. The baseline is
  # regenerated only with a reviewed change to the gate.
  - job: unit_bench_tui
    displayName: Bench (TUI)
    pool:
      name: GitHub-hosted Agents
      vmImage: ubuntu-24.04-8-core
    timeoutInMinutes: 30
    steps:
      - checkout: self
        fetchDepth: 1
      - template: templates/toolchain.yml
      - bash: bun run bench:tui -- --repeats=5 --enforce
        displayName: Run TUI performance gate
        workingDirectory: packages/tui
        timeoutInMinutes: 25

  - job: unit_httpapi
    displayName: Unit Tests (HttpAPI)
    pool:
      name: GitHub-hosted Agents
      vmImage: ubuntu-24.04-8-core
    timeoutInMinutes: 45
    steps:
      - checkout: self
        fetchDepth: 1
      - template: templates/toolchain.yml
        parameters:
          ripgrep: true
          gitIdentity: true
      - bash: bun turbo run build --filter='graphagent^...'
        displayName: Build graphagent test dependencies
      # The exerciser prints its report in one flush, so this step is silent
      # while it runs. --progress arms an out-of-process watchdog that kills
      # the runner after 120s without progress and names the last scenario;
      # the step timeout is the final backstop (slowest passing runs ~15m).
      - bash: bun run test:httpapi:ci
        displayName: Run HttpAPI exerciser gates
        workingDirectory: packages/graphagent
        timeoutInMinutes: 25

  # Aggregate required check. It runs even when a unit job failed or was
  # skipped, and fails unless every unit job succeeded, so a skipped
  # dependency can never satisfy branch protection.
  - job: unit_tests
    displayName: Unit Tests (linux)
    dependsOn:
      - unit_workspace
      - unit_httpapi
      - unit_bench_tui
      - ${{ each shard in parameters.shards }}:
          - unit_graphagent_${{ shard }}
    condition: always()
    pool:
      name: GitHub-hosted Agents
      vmImage: ubuntu-24.04-8-core
    timeoutInMinutes: 5
    variables:
      UNIT_RESULT_WORKSPACE: $[ dependencies.unit_workspace.result ]
      UNIT_RESULT_HTTPAPI: $[ dependencies.unit_httpapi.result ]
      UNIT_RESULT_BENCH_TUI: $[ dependencies.unit_bench_tui.result ]
      ${{ each shard in parameters.shards }}:
        UNIT_RESULT_GRAPHAGENT_${{ shard }}: $[ dependencies.unit_graphagent_${{ shard }}.result ]
    steps:
      - checkout: none
      - bash: |
          set -euo pipefail
          expected=$(( 3 + ${{ length(parameters.shards) }} ))
          count=0
          while IFS='=' read -r name result; do
            count=$((count + 1))
            echo "$name=$result"
            if [ "$result" != "Succeeded" ]; then
              echo "##vso[task.logissue type=error]$name finished with result: $result"
              exit 1
            fi
          done < <(env | grep '^UNIT_RESULT_' | sort)
          if [ "$count" -ne "$expected" ]; then
            echo "##vso[task.logissue type=error]Expected $expected unit gate results, found $count"
            exit 1
          fi
          echo "All unit gates passed."
        displayName: Require every unit gate
