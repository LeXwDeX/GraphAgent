# ============================================================================
# 🔍 CI · Typecheck
# ----------------------------------------------------------------------------
# Purpose : TypeScript type checking across all packages (bun typecheck),
#           oxlint warning ratchet, and the DAG core behavior/coverage gate
# Trigger : Push to `main`, PRs targeting `main`, manual dispatch
# Jobs    : typecheck — single Linux runner, `bun run lint` + `bun typecheck`
# Gate    : Required status check on `main` PRs. The DAG core gate protects
#           state-machine and persistence changes before they merge to main.
# Notes   : No push trigger on feat/* or fix/* (frequent changes); PRs cover
#           them.
# Runners : All events use GitHub-hosted Ubuntu runners.
# ============================================================================

name: 🔍 CI · Typecheck

on:
  push:
    branches:
      - main
  pull_request:
    # Re-run checks when a draft becomes ready for review.
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Setup GitHub CLI
        uses: ./.github/actions/setup-gh

      - name: Check previously verified content
        id: evidence
        uses: ./.github/actions/verified-content
        with:
          check: typecheck
          job-name: Typecheck
          runner-label: ubuntu-latest

      - name: Setup Bun
        if: steps.evidence.outputs.reused != 'true'
        uses: ./.github/actions/setup-bun

      - name: Test CI verification fingerprint
        run: node --test script/ci-fingerprint.test.mjs script/ci-evidence.test.mjs script/ci-runner-routing.test.mjs script/ci-runner-smoke.test.mjs script/toolchain.test.mjs

      - name: Test GitHub CLI bootstrap
        run: bash script/setup-gh.test.sh

      - name: Run lint
        if: steps.evidence.outputs.reused != 'true'
        run: bun run lint

      - name: Run typecheck
        if: steps.evidence.outputs.reused != 'true'
        run: bun typecheck

      - name: Run DAG core behavior and coverage gate
        if: steps.evidence.outputs.reused != 'true'
        working-directory: packages/opencode
        run: bun run test:dag-core
        timeout-minutes: 10

      # #498 B1: archive integrity boundary of the `oc` installer — SHA256SUMS
      # must be verified before extraction and fail closed on mismatch.
      # Zero network (stub curl); portable across bash hosts.
      - name: Run oc install boundary tests
        if: steps.evidence.outputs.reused != 'true'
        run: bash script/oc-install-boundary.test.sh && bash script/oc-path-priority.test.sh
        timeout-minutes: 5

      - name: Record successful verification
        if: success() && steps.evidence.outputs.reused != 'true'
        uses: ./.github/actions/record-verification
        with:
          check: typecheck
          key: ${{ steps.evidence.outputs.key }}
          path: ${{ steps.evidence.outputs.path }}
          job-name: Typecheck
