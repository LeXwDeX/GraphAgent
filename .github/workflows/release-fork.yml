# ============================================================================
# 📦 Release · Fork Build
# ----------------------------------------------------------------------------
# Purpose : Build opencode CLI binaries (linux / macos / windows) for the
#           LeXwDeX/opencode fork. Stripped-down version of upstream
#           publish.yml — removes repo guard, Blacksmith runners, code
#           signing, npm publish, and Tauri desktop.
# Trigger : Manual workflow_dispatch from main only
#           Push to main ONLY registers the workflow in the Actions UI
#           (the build job is gated on `github.event_name == 'workflow_dispatch'`)
# Version : Independent GraphAgent SemVer derived only from graphagent-v* tags.
#           main builds X.Y.Z and marks it Latest. Historical dev tags do not
#           advance the stable line. OpenCode package versions are ignored.
# Inputs  : create_release — when true, create a GitHub Release with the
#                            built binaries + SHA256SUMS attached. The default
#                            is false so an ordinary dispatch exercises
#                            the complete candidate path without publishing.
#           platforms      — comma-separated subset of linux,macos,windows
#                            to build. Leave blank to build all three.
# Jobs    : package-templates — package latest reference templates from the
#                               opencode-dag-config repo into a release asset
#           build-cli — 3-OS matrix, bundles ripgrep + single-file binary
#           prepare-release — always assembles and verifies a release candidate
#           publish-release — optional, creates the GitHub Release
#           register  — no-op for push triggers, just registers in Actions UI
# Output  : Artifacts: opencode-{linux,macos,windows}.{tar.gz,zip} +
#           dag-templates.tar.gz + SHA256SUMS
# ============================================================================

name: 📦 Release · Fork Build

on:
  # Manual trigger — the primary way to build releases
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub Release with the built binaries"
        required: false
        type: boolean
        default: false
      platforms:
        description: "Platforms to build, comma-separated (linux,macos,windows). Leave blank for all."
        required: false
        type: string
  # Also run on push to main so the workflow registers in Actions UI
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-fork.yml"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-fork
  cancel-in-progress: false

jobs:
  version:
    name: Resolve GraphAgent Version
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      channel: ${{ steps.release-version.outputs.channel }}
      version: ${{ steps.release-version.outputs.version }}
      tag: ${{ steps.release-version.outputs.tag }}
      prerelease: ${{ steps.release-version.outputs.prerelease }}
      latest: ${{ steps.release-version.outputs.latest }}
      previous_tag: ${{ steps.release-version.outputs.previous_tag }}

    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Stable GraphAgent releases must be dispatched from main."
          exit 1

      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          save-cache: false

      - name: Resolve Version
        id: release-version
        run: bun run ./packages/opencode/script/release-version.ts

  # Package the latest reference templates from the dedicated config repo
  # (LeXwDeX/opencode-dag-config) into a release asset. main does not manage
  # these templates anymore — the config repo is the single source of truth.
  # Read-only: no commits, no pushes, so branch protection never blocks it.
  #
  # Validate-before-package: the releasing runtime commit runs its directory
  # validator against the config repo HEAD BEFORE any copy/package step. Any
  # invalid template — or an unavailable validator — fails the job (fail
  # closed), so an unchecked archive can never be uploaded or embedded.
  package-templates:
    name: Package Reference Templates
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout Runtime (releasing commit)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Clone Config Repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: LeXwDeX/opencode-dag-config
          path: dag-config
          persist-credentials: false

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          save-cache: false

      - name: Install Runtime Dependencies
        run: bun install --frozen-lockfile

      - name: Validate and Package Templates (fail closed)
        working-directory: packages/opencode
        run: |
          set -o pipefail
          echo "Packaging config commit $(git -C "$GITHUB_WORKSPACE/dag-config" rev-parse HEAD) with runtime commit $(git rev-parse HEAD)"
          bun run script/package-dag-templates.ts \
            "$GITHUB_WORKSPACE/dag-config" \
            "$GITHUB_WORKSPACE/dag-templates.tar.gz" \
            | tee "$GITHUB_WORKSPACE/dag-template-provenance.json"

      - name: Verify Template Provenance
        run: |
          RUNTIME_COMMIT="$(git rev-parse HEAD)" \
          TEMPLATE_COMMIT="$(git -C "$GITHUB_WORKSPACE/dag-config" rev-parse HEAD)" \
          PROVENANCE_PATH="$GITHUB_WORKSPACE/dag-template-provenance.json" \
          bun -e '
            const report = await Bun.file(process.env.PROVENANCE_PATH).json()
            for (const key of ["runtime_commit", "template_commit", "compat_runtime_sha"]) {
              if (typeof report[key] !== "string" || !/^[0-9a-f]{40}$/.test(report[key])) {
                throw new Error("invalid " + key + " in template provenance")
              }
            }
            if (report.runtime_commit !== process.env.RUNTIME_COMMIT) throw new Error("runtime provenance mismatch")
            if (report.template_commit !== process.env.TEMPLATE_COMMIT) throw new Error("template provenance mismatch")
          '

      - name: Upload Templates Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dag-templates
          path: |
            dag-templates.tar.gz
            dag-template-provenance.json
          retention-days: 7

  build-cli:
    name: Build CLI (${{ matrix.name }})
    needs: [version, package-templates]
    # Skip the actual build when triggered by push (registration-only). Per-
    # matrix-entry platform filtering can't live here — `matrix` isn't in
    # scope for a job-level `if:` — so it's applied to each step below instead.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            name: linux
          - runner: macos-latest
            name: macos
          - runner: windows-latest
            name: windows
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Repository
        if: inputs.platforms == '' || contains(inputs.platforms, matrix.name)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        if: inputs.platforms == '' || contains(inputs.platforms, matrix.name)
        uses: ./.github/actions/setup-bun
        with:
          # Development CI runs on Azure Pipelines, whose Azure DevOps Cache@2
          # store (key `bun | OS | arch | bun.lock`) is a separate cache
          # system. No GitHub Actions workflow saves Linux or Windows bun
          # caches, so there is no {OS}-bun-{hash} key race to avoid; macOS is
          # the only GitHub-hosted build in this repository.
          save-cache: ${{ matrix.name == 'macos' }}

      # Embed a models.dev catalog snapshot into the binary so air-gapped
      # users can start opencode without reaching https://models.dev at
      # runtime (see packages/opencode/script/generate.ts fallback order).
      - name: Fetch models.dev Snapshot
        if: inputs.platforms == '' || contains(inputs.platforms, matrix.name)
        run: |
          snapshot_path="$RUNNER_TEMP/models-dev-api.json"
          if command -v cygpath &>/dev/null; then
            snapshot_path="$(cygpath -m "$snapshot_path")"
          fi
          for attempt in 1 2 3; do
            if curl -fsSL --max-time 30 https://models.dev/api.json -o "$snapshot_path"; then
              echo "models.dev snapshot downloaded (attempt $attempt)"
              echo "MODELS_DEV_API_JSON=$snapshot_path" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "models.dev download failed (attempt $attempt), retrying..."
            sleep 5
          done
          echo "::warning::Failed to download models.dev api.json; build will fall back to @opencode-ai/models snapshot or an empty catalog"

      # Embed the latest DAG reference templates into the binary so air-gapped
      # installs ship the curated workflows (see dag/workflows.ts builtin scope
      # and script/generate.ts DAG_TEMPLATES_DIR loading).
      - name: Download Templates Artifact
        if: inputs.platforms == '' || contains(inputs.platforms, matrix.name)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dag-templates
          path: dag-templates-artifact

      - name: Extract Templates
        if: inputs.platforms == '' || contains(inputs.platforms, matrix.name)
        run: |
          mkdir -p dag-templates-src
          tar -xzf dag-templates-artifact/dag-templates.tar.gz -C dag-templates-src
          templates_dir="$GITHUB_WORKSPACE/dag-templates-src"
          if command -v cygpath &>/dev/null; then
            templates_dir="$(cygpath -m "$templates_dir")"
          fi
          echo "DAG_TEMPLATES_DIR=$templates_dir" >> "$GITHUB_ENV"

      - name: Build CLI
        if: inputs.platforms == '' || contains(inputs.platforms, matrix.name)
        run: ./packages/opencode/script/build.ts --single --skip-install
        env:
          OPENCODE_CHANNEL: latest
          OPENCODE_VERSION: ${{ needs.version.outputs.version }}

      # Bundle ripgrep into each dist/opencode-*/bin so air-gapped users do not
      # hit the runtime download in packages/core/src/ripgrep/binary.ts.
      - name: Prefetch Ripgrep
        if: inputs.platforms == '' || contains(inputs.platforms, matrix.name)
        run: bun run ./packages/opencode/script/prefetch-ripgrep.ts

      - name: Verify CLI executable
        if: matrix.name != 'macos' && (inputs.platforms == '' || contains(inputs.platforms, matrix.name))
        run: |
          for dir in packages/opencode/dist/opencode-*/; do
            cli="$dir/bin/opencode"
            if [[ -f "$cli.exe" ]]; then cli="$cli.exe"; fi
            actual="$("$cli" --version)"
            if [[ "$actual" != "${{ needs.version.outputs.version }}" ]]; then
              echo "Unexpected CLI version: $actual" >&2
              exit 1
            fi
            "$cli" --help > /dev/null
          done
        timeout-minutes: 5

      - name: Package Artifacts
        if: inputs.platforms == '' || contains(inputs.platforms, matrix.name)
        working-directory: packages/opencode/dist
        run: |
          for dir in opencode-*/; do
            base="${dir%/}"
            if [[ "$base" == *linux* ]]; then
              bun run ../script/package-cli-artifact.ts "$base" "${base}.tar.gz"
            else
              bun run ../script/package-cli-artifact.ts "$base" "${base}.zip"
            fi
          done

      # #498 B2: macOS release acceptance — after the installer-style xattr +
      # ad-hoc re-sign mutation, assert codesign validity and executable smoke.
      # The installed binary's hash is intentionally NOT compared to the
      # archive payload (ad-hoc re-signing can rewrite bytes, so byte equality
      # is not a stable signature-validity boundary and differing hashes are
      # legitimate); no post-sign digest.
      - name: macOS Install Acceptance
        if: matrix.name == 'macos' && (inputs.platforms == '' || contains(inputs.platforms, matrix.name))
        run: bash script/oc-macos-acceptance.test.sh packages/opencode/dist/opencode-darwin-arm64.zip
        timeout-minutes: 10

      - name: Upload Artifacts
        if: inputs.platforms == '' || contains(inputs.platforms, matrix.name)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-${{ matrix.name }}
          path: |
            packages/opencode/dist/*.tar.gz
            packages/opencode/dist/*.zip

  prepare-release:
    name: Prepare Release Candidate
    needs: [version, build-cli, package-templates]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup GitHub CLI
        uses: ./.github/actions/setup-gh

      - name: Download Artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: release-assets
        env:
          SELECTED_PLATFORMS: ${{ inputs.platforms }}
        run: |
          shopt -s nullglob
          assets=(opencode-*.tar.gz opencode-*.zip dag-templates.tar.gz dag-template-provenance.json)
          if (( ${#assets[@]} < 3 )); then
            echo "::error::Release candidate is incomplete: expected templates, provenance, and at least one CLI archive."
            exit 1
          fi
          selected="$SELECTED_PLATFORMS"
          require_archive() {
            local platform="$1"
            local pattern="$2"
            if [[ -z "$selected" || "$selected" == *"$platform"* ]]; then
              if ! compgen -G "$pattern" >/dev/null; then
                echo "::error::Release candidate is missing the selected $platform archive ($pattern)."
                exit 1
              fi
            fi
          }
          require_archive linux "opencode-linux-*.tar.gz"
          require_archive macos "opencode-darwin-*.zip"
          require_archive windows "opencode-windows-*.zip"
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${assets[@]}" > SHA256SUMS
          elif command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${assets[@]}" > SHA256SUMS
          else
            echo "::error::Neither shasum nor sha256sum is available on the trusted Linux release runner."
            exit 1
          fi
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          save-cache: false

      # Render + validate the per-series notes file (.github/releases/vX.Y.Z.md)
      # BEFORE a candidate can be published. Fail closed: a missing or invalid
      # series file stops the job here, so a release can never ship with
      # placeholder notes. The rendered notes are retained in the candidate
      # artifact as acceptance evidence, then consumed by publish-release.
      - name: Render Release Notes (fail closed)
        run: |
          bun run ./packages/opencode/script/release-notes.ts \
            --notes-dir ".github/releases" \
            --version "${{ needs.version.outputs.version }}" \
            --channel "${{ needs.version.outputs.channel }}" \
            --branch "${{ github.ref_name }}" \
            --tag "${{ needs.version.outputs.tag }}" \
            --previous-tag "${{ needs.version.outputs.previous_tag }}" \
            --repo "${{ github.repository }}" \
            --out "$GITHUB_WORKSPACE/release-assets/RELEASE_NOTES.md"

      - name: Verify Release Candidate
        working-directory: release-assets
        run: |
          test -s SHA256SUMS
          test -s RELEASE_NOTES.md
          test -s dag-template-provenance.json
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 --check SHA256SUMS
          else
            sha256sum --check SHA256SUMS
          fi

      - name: Upload Release Candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate-${{ needs.version.outputs.version }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Create GitHub Release
    needs: [version, prepare-release]
    if: inputs.create_release && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download Release Candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate-${{ needs.version.outputs.version }}
          path: release-assets

      - name: Setup GitHub CLI
        env:
          GH_CLI_VERSION: "2.101.0"
          GH_CLI_LINUX_AMD64_SHA256: 9bca2d1c16825f109907a23307628a2f0698fbf99662b73a5cf0b020293072b8
          GH_CLI_DOWNLOAD_BASE_URL: https://github.com/cli/cli/releases/download/v2.101.0
        run: |
          set -euo pipefail
          if [ "${RUNNER_OS:-}" != "Linux" ] || [ "${RUNNER_ARCH:-}" != "X64" ]; then
            echo "::error::Unsupported GitHub CLI bootstrap platform: ${RUNNER_OS:-unknown}/${RUNNER_ARCH:-unknown}" >&2
            exit 1
          fi
          asset="gh_${GH_CLI_VERSION}_linux_amd64.tar.gz"
          download_dir="$(mktemp -d "$RUNNER_TEMP/gh-cli-download.XXXXXX")"
          install_dir="$(mktemp -d "$RUNNER_TEMP/gh-cli-install.XXXXXX")"
          trap 'rm -rf "$download_dir"' EXIT
          archive="$download_dir/$asset"
          curl --fail --location --silent --show-error \
            --connect-timeout 20 --max-time 300 --retry 3 --retry-delay 1 \
            --output "$archive" "$GH_CLI_DOWNLOAD_BASE_URL/$asset"
          if command -v sha256sum >/dev/null 2>&1; then
            actual="$(sha256sum "$archive" | awk '{print $1}')"
          elif command -v shasum >/dev/null 2>&1; then
            actual="$(shasum -a 256 "$archive" | awk '{print $1}')"
          else
            echo "::error::A SHA-256 tool (sha256sum or shasum) is required." >&2
            exit 1
          fi
          if [ "$actual" != "$GH_CLI_LINUX_AMD64_SHA256" ]; then
            echo "::error::GitHub CLI archive checksum mismatch: expected $GH_CLI_LINUX_AMD64_SHA256, got $actual" >&2
            exit 1
          fi
          tar -xzf "$archive" -C "$install_dir"
          bin_dir="$install_dir/gh_${GH_CLI_VERSION}_linux_amd64/bin"
          test -x "$bin_dir/gh"
          printf '%s\n' "$bin_dir" >> "$GITHUB_PATH"
          "$bin_dir/gh" --version

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # Stable releases are explicitly promoted to Latest.
        run: |
          shopt -s nullglob
          assets=(
            release-assets/*.tar.gz
            release-assets/*.zip
            release-assets/SHA256SUMS
            release-assets/dag-template-provenance.json
          )
          gh release create "${{ needs.version.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "OpenCode GraphAgent v${{ needs.version.outputs.version }}" \
            --notes-file "release-assets/RELEASE_NOTES.md" \
            --target "${{ github.sha }}" \
            --latest \
            "${assets[@]}"

  # No-op job for push-triggered runs — just registers the workflow in Actions UI
  register:
    name: Register Workflow
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Register Workflow
        run: echo "Workflow registered in Actions UI"
