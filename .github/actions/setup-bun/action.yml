name: "Setup Bun"
description: "Setup Bun with caching and install dependencies"
inputs:
  install-flags:
    description: "Additional flags to pass to 'bun install'"
    required: false
    default: ""
  save-cache:
    description: "Whether to save the bun cache after install (set false for jobs that share an OS with another saver)"
    required: false
    default: "true"
runs:
  using: "composite"
  steps:
    # node-gyp@latest (invoked via bunx for native install scripts) requires Node >=22;
    # some runner images ship an older system Node on PATH
    - name: Setup Node
      uses: ./.github/actions/setup-node

    - name: Get baseline download URL
      id: bun-url
      shell: bash
      run: |
        if [ "$RUNNER_ARCH" = "X64" ]; then
          V=$(node script/toolchain.mjs get bun)
          case "$RUNNER_OS" in
            macOS)   OS=darwin ;;
            Linux)   OS=linux ;;
            Windows) OS=windows ;;
          esac
          echo "url=https://github.com/oven-sh/bun/releases/download/bun-v${V}/bun-${OS}-x64-baseline.zip" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: ${{ !steps.bun-url.outputs.url && 'package.json' || '' }}
        bun-download-url: ${{ steps.bun-url.outputs.url }}

    - name: Verify toolchain
      shell: bash
      run: node script/toolchain.mjs check

    - name: Get cache directory
      id: cache
      shell: bash
      run: echo "dir=$(bun pm cache)" >> "$GITHUB_OUTPUT"

    - name: Restore Bun dependencies
      id: bun-cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.cache.outputs.dir }}
        key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Install setuptools for distutils compatibility
      run: python3 -m pip install setuptools || pip install setuptools || true
      shell: bash

    # Native install scripts without prebuilds (tree-sitter-powershell via
    # node-gyp-build) spawn `node-gyp` from PATH. Self-hosted runners do not
    # guarantee one, so expose the copy bundled with the pinned Node's npm
    # instead of depending on runner state. No network, no global install.
    - name: Provide node-gyp from the pinned Node
      if: runner.os != 'Windows'
      shell: bash
      run: |
        # Derive from the node binary: npm output redacts UUID-like path segments.
        gyp="$(node -p 'require("path").resolve(process.execPath, "../../lib/node_modules/npm/node_modules/node-gyp/bin/node-gyp.js")')"
        if [ ! -f "$gyp" ]; then
          echo "::error::node-gyp bundled with npm not found at $gyp"
          exit 1
        fi
        dir="$RUNNER_TEMP/node-gyp-bin"
        mkdir -p "$dir"
        printf '#!/usr/bin/env bash\nexec node "%s" "$@"\n' "$gyp" > "$dir/node-gyp"
        chmod +x "$dir/node-gyp"
        echo "$dir" >> "$GITHUB_PATH"
        echo "node-gyp $(node "$gyp" --version) from $gyp"

    - name: Install dependencies
      run: |
        # Workaround for patched peer variants
        # e.g. ./patches/ for standard-openapi
        # https://github.com/oven-sh/bun/issues/28147
        if [ "$RUNNER_OS" = "Windows" ]; then
          bun install --frozen-lockfile --linker hoisted ${{ inputs.install-flags }}
        else
          bun install --frozen-lockfile ${{ inputs.install-flags }}
        fi
      shell: bash

    - name: Save Bun dependencies
      if: inputs.save-cache == 'true' && steps.bun-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ steps.cache.outputs.dir }}
        key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
