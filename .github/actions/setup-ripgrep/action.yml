name: Setup ripgrep
description: Provide the system ripgrep binary on hosted Linux, cached across runs instead of reinstalling it every job
runs:
  using: composite
  steps:
    # tool.glob tests hit ripgrep; without the system binary, binary.ts
    # downloads rg from GitHub releases every run (temp XDG per preload),
    # gambling on network stability — ECONNRESET fails the test.
    - name: Restore cached ripgrep
      id: cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/ripgrep-bin
        key: ripgrep-${{ runner.os }}-${{ runner.arch }}-v1
    - name: Ensure ripgrep prerequisite
      shell: bash
      env:
        RG_DIR: ${{ runner.temp }}/ripgrep-bin
      run: |
        if command -v rg >/dev/null 2>&1; then
          exit 0
        fi
        if [ ! -x "$RG_DIR/rg" ]; then
          sudo apt-get update && sudo apt-get install -y ripgrep
          mkdir -p "$RG_DIR"
          cp "$(command -v rg)" "$RG_DIR/rg"
        fi
        echo "$RG_DIR" >> "$GITHUB_PATH"
        "$RG_DIR/rg" --version | head -1
